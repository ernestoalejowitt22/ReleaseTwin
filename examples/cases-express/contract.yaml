# The no-flag path: a plain contract check against the same Express API. Two
# JSONPath assertions against a live response — this is all you need to
# release-proof a REST endpoint that has no feature flag in play.
#
# Setup: run the express-demo app (releasetwin-ci-examples/apps/express-demo) and
# set API_BASE_URL=http://localhost:4599 — or point API_BASE_URL at your own API.
id: EXPRESS-CONTRACT-1
oracle:
  locator: docs/express.md
fixture:
  locator: express-orders.json
  sha256: 2e719aca76eee32d96693974b5092a74a701ca05c35382faffbefbe95dc0c9d0
requires:
  - http:generic
pipeline:
  - operation: http.request
    with:
      method: GET
      url: ${API_BASE_URL}/orders/42
  - operation: http.assertJsonPath
    with:
      path: $.id
      expected: 42
  - operation: http.assertJsonPath
    with:
      path: $.currency
      expected: USD
