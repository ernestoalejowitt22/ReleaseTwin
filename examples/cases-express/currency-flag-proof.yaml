# A second flag-proof case against the same plain Node/Express API — no
# adapter, no plugin, same shared control template as flag-proof.yaml
# (releasetwin.yml), just a different feature_key. The always-present HTTP
# adapter flips the demo's `currency-normalization` flag over REST and the
# pipeline reads the *behaviour* that flag gates:
#
#   known-bad leg  (currency-normalization disabled) -> "usd" left as-is -> assertion FAILS
#   known-good leg (currency-normalization enabled)  -> "usd" upper-cased -> assertion PASSES
#
# One leg fails, the other passes => `Passed`: the oracle genuinely tells the
# broken build from the fixed one. Both legs return 201 — the HTTP adapter
# fails a request step on any non-2xx response, so this flag's behavior
# difference lives entirely in the response body, never the status code
# (see docs/express.md and this repo's richer-express-demo-cases change).
#
# Setup: run the express-demo app (releasetwin-ci-examples/apps/express-demo:
#   `npm ci && npm start`) and set API_BASE_URL=http://localhost:4599
id: EXPRESS-FLAGPROOF-CURRENCY-1
oracle:
  locator: docs/express.md
fixture:
  locator: express-orders.json
  sha256: 2e719aca76eee32d96693974b5092a74a701ca05c35382faffbefbe95dc0c9d0
requires:
  - http:generic
pipeline:
  - operation: http.request
    with:
      method: POST
      url: ${API_BASE_URL}/orders
      body:
        currency: usd
        subtotal: 100
  - operation: http.assertJsonPath
    with:
      path: $.currency
      expected: USD
flag_proof:
  feature_key: currency-normalization
  build_identity: express-demo@1
