# discovery-surfaces §3: the public PR-gate billboard on releasetwin-ci-examples.
# One case, one assertion, against the same express-demo app cases-express already
# uses — small enough that a visitor can see the whole story (a real bug in
# server.js's total calculation, caught by this case, then fixed) in a single PR
# diff. Runs via `releasetwin/releasetwin-action` on `pull_request`, separate from
# the push-triggered cases-express suite that feeds https://releasetwin.com/demo,
# so this billboard never touches the public example organization's real data.
#
# Setup: run the express-demo app (releasetwin-ci-examples/apps/express-demo:
#   `npm ci && npm start`) and set API_BASE_URL=http://localhost:4599
id: EXPRESS-PR-GATE-DEMO-1
release: "pr-gate-demo/1.0"
oracle:
  locator: docs/express.md
fixture:
  locator: express-orders.json
  sha256: 2e719aca76eee32d96693974b5092a74a701ca05c35382faffbefbe95dc0c9d0
requires:
  - http:generic
pipeline:
  - operation: http.request
    with:
      method: GET
      url: ${API_BASE_URL}/orders/42
  - operation: http.assertJsonPath
    with:
      path: $.total
      expected: 100
