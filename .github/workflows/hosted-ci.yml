name: Hosted CI

on:
  push:
    branches: [main]
    paths: ["hosted/**", "flags.json"]
  pull_request:
    paths: ["hosted/**", "flags.json"]


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ReleaseTwin.Hosted.slnx

      - name: Build
        run: dotnet build ReleaseTwin.Hosted.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ReleaseTwin.Hosted.slnx --no-build --configuration Release
