#
# ci-pr-integration: dogfoods integrations/github-action against the bundled HTTP example,
# proving the PR-comment + check-run path end to end. Builds this repo's CLI image locally
# so the run reflects the code on the PR, not a published release.
name: PR annotations (dogfood)

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  render-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit-test the summary renderer
        run: node --test integrations/github-action/render.test.mjs
      - name: Lint the GitLab CI/CD Component template
        run: node --test integrations/gitlab-component/templates/releasetwin.test.mjs

  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the CLI image
        run: docker build -t releasetwin-cli:ci .

      - name: Run ReleaseTwin on the HTTP example and annotate the PR
        uses: ./integrations/github-action
        with:
          cases-path: examples/cases-http-only
          image: releasetwin-cli:ci
