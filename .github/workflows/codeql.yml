#
# supply-chain-and-ci-hardening (supply-chain-assurance): CodeQL SAST across this repo's C# engine
# code and its JavaScript (the GitHub Action's render script), on every PR, every push to main, and
# a weekly full sweep. Advanced setup (this file) rather than repo-settings "default setup" so the
# schedule, query suite, and build steps are reviewable and diffable.
#
# Code scanning is enabled (the repository is public), so results upload to the Security tab and the
# Analyze step is a hard gate: a failure here blocks the PR. Triage findings in the Security tab —
# dismiss a false positive with a reason rather than reintroducing `continue-on-error`.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required to upload results to the Security tab
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Default (`security`) query suite for now — keeps PR noise low. `security-extended` is the
          # later opt-in once the baseline is clean and triaged.

      # C# needs a real compile; JS/TS is analysed directly from source (no build step).
      - name: Build C#
        if: matrix.language == 'csharp'
        run: dotnet build ReleaseTwin.sln --configuration Release

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results

      # So findings are reviewable even without the Security tab.
      - name: Upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results
          if-no-files-found: ignore
