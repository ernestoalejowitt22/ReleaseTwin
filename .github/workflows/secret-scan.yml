name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `gitleaks git` can scan every commit. Cheap for a repo this size.
          fetch-depth: 0

      # supply-chain-and-ci-hardening: download the pinned release tarball AND its checksums file to
      # disk, verify the SHA-256 before extracting — never pipe an unverified network download into
      # tar. (Switch to a SHA-pinned gitleaks-action if the repo ever moves under a licensed org.)
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.24.3
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$ARCHIVE" "${BASE}/${ARCHIVE}"
          curl -fsSL -o checksums.txt "${BASE}/gitleaks_${VERSION}_checksums.txt"
          grep " ${ARCHIVE}\$" checksums.txt | sha256sum -c -
          tar -xzf "$ARCHIVE" -C /usr/local/bin gitleaks
          rm -f "$ARCHIVE" checksums.txt
          gitleaks version

      # Scans every commit in history plus the current committed tree. A fresh checkout has no
      # build output or dependencies, so `gitleaks git` is the complete picture in CI; run
      # `gitleaks dir` locally if you want to also sweep an uncommitted working tree.
      - name: Scan commit history
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --verbose --exit-code 1
