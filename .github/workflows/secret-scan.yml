name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history sweep, Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # PR/push runs scan the incremental range; the scheduled run scans all history.
          fetch-depth: ${{ github.event_name == 'schedule' && 0 || 1 }}

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # gitleaks-action is free for public repos. For a private repo it needs
          # GITLEAKS_LICENSE set from a (free) gitleaks.io key — add it as a repo secret
          # if this repo is still private when the workflow lands.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
