name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write — only for the floating v<major> / v<major>.<minor> tag push at the
      # end (cli-distribution). Scoped to this job; the checkout is already the verified
      # release commit, and the push targets only those two derived tags.
      contents: write
      packages: write
      # id-token: write — lets this job request a GitHub OIDC token, which NuGet.org's
      # Trusted Publishing exchanges for a short-lived (1h) API key. No NUGET_API_KEY
      # secret to store or rotate; see the "NuGet login" step below.
      id-token: write
    steps:
      # github-marketplace-listing: full history is needed for `git subtree split`
      # (the mirroring step, near the end of this job) to work correctly — a shallow
      # clone would silently produce an incomplete or incorrect split.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ReleaseTwin.sln

      - name: Build
        run: dotnet build ReleaseTwin.sln --no-restore --configuration Release

      # ReleaseTwin.Adapters.Ui.Tests drives a real Chromium via Playwright — the browser binary
      # isn't on the runner by default. The install script ships next to the built test assembly.
      - name: Install Playwright browsers
        run: pwsh tests/ReleaseTwin.Adapters.Ui.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: dotnet test ReleaseTwin.sln --no-build --configuration Release

      - name: Derive release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # cli-distribution: the CLI as a .NET global tool on nuget.org. Same build+test gate as
      # the container below.
      - name: Pack the CLI tool
        run: dotnet pack src/ReleaseTwin.Cli/ReleaseTwin.Cli.csproj --no-build --configuration Release -p:Version=${{ steps.version.outputs.version }} -o ./artifacts

      # NuGet Trusted Publishing (OIDC): requested right before the push per NuGet's own
      # guidance — the exchanged API key is valid for only 1 hour. NUGET_USER is a plain
      # repo variable (the nuget.org username on the trusted-publishing policy), not a
      # secret — nothing here is sensitive, the whole point of Trusted Publishing is that
      # there is no long-lived key to store.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Derive lowercase image name
        id: image
        run: |
          echo "name=$(echo 'ghcr.io/${{ github.repository }}/cli' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

      # bitbucket-custom-pipe: built FROM the CLI image digest just pushed above, so it can
      # never reference a stale base — same freshness guarantee as the Action pin below.
      - name: Derive lowercase pipe image name
        id: pipe-image
        run: |
          echo "name=$(echo 'ghcr.io/${{ github.repository }}/bitbucket-pipe' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push the Bitbucket Pipe wrapper image
        id: build-pipe
        uses: docker/build-push-action@v6
        with:
          context: integrations/bitbucket-pipe
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          tags: |
            ${{ steps.pipe-image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.pipe-image.outputs.name }}:latest

      # supply-chain-and-ci-hardening: advance the published Action's default image to the digest
      # just built, committed to main, so `uses: <repo>/integrations/github-action@v0` runs an
      # immutable image. Only reached after build+test+tool-push+image-push all succeeded. `:latest`
      # is still pushed above for human convenience, but the Action never references it.
      #
      # bitbucket-custom-pipe: the same commit also pins pipe.yml's image reference and the
      # wrapper Dockerfile's default BASE_IMAGE arg to their own just-built digest/version.
      - name: Pin the Action default image and the Bitbucket Pipe references to the new build
        id: pin
        run: |
          set -euo pipefail
          digest='${{ steps.build.outputs.digest }}'
          name='${{ steps.image.outputs.name }}'
          pipe_digest='${{ steps.build-pipe.outputs.digest }}'
          pipe_name='${{ steps.pipe-image.outputs.name }}'
          version='${{ steps.version.outputs.version }}'
          [ -n "$digest" ] || { echo "::error::build-push-action produced no digest"; exit 1; }
          [ -n "$pipe_digest" ] || { echo "::error::bitbucket-pipe build-push-action produced no digest"; exit 1; }

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          file=integrations/github-action/action.yml
          sed -i -E "s#(^    default: )ghcr\.io/.*/cli[:@].*#\1${name}@${digest}#" "$file"

          pipe_yml=integrations/bitbucket-pipe/pipe.yml
          sed -i -E "s#(^image: )ghcr\.io/.*/bitbucket-pipe[:@].*#\1${pipe_name}@${pipe_digest}#" "$pipe_yml"

          dockerfile=integrations/bitbucket-pipe/Dockerfile
          sed -i -E "s#(^ARG BASE_IMAGE=)ghcr\.io/.*/cli[:@].*#\1${name}:${version}#" "$dockerfile"

          git add "$file" "$pipe_yml" "$dockerfile"
          if git diff --cached --quiet; then
            echo "Action/pipe references already current."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "release: pin github-action + bitbucket-pipe image references to ${version}"
            git push origin main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # cli-distribution: move the floating major / minor tags so `uses: <repo>/integrations/
      # github-action@v0` (and @v0.N) resolves and tracks patches — the standard GitHub Action
      # distribution pattern. They point at the digest-pin commit above (falling back to the
      # release commit if nothing was pinned), so @v0 always carries an immutable image default.
      # Force-push is limited to exactly these two derived refs.
      - name: Update floating version tags
        run: |
          version="${{ steps.version.outputs.version }}"
          major="v${version%%.*}"
          minor="v${version%.*}"
          target="${{ steps.pin.outputs.sha || github.sha }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for t in "$major" "$minor"; do
            git tag -f "$t" "$target"
            git push -f origin "refs/tags/$t"
            echo "moved $t -> $target"
          done

      # github-marketplace-listing: GitHub only allows a Marketplace listing when
      # action.yml sits at a repo's root, and this repo's own root license (AGPL-3.0)
      # would otherwise misrepresent the Action's actual Apache-2.0 license on that
      # listing (see design.md). `releasetwin-action` is a pure mirror of
      # integrations/github-action/ — it is never edited directly, so a force-push
      # here loses no independent history. Skipped (not failed) until the user has
      # created the repo and secret (openspec/changes onward:
      # archive/2026-09-04-github-marketplace-listing/tasks.md 1.1-1.2).
      - name: Mirror the Action to the dedicated Marketplace-eligible repository
        # Secrets cannot be referenced directly in an `if:` conditional (GitHub rejects the
        # whole workflow file at registration time if you try) — the presence check is done
        # via `env:` instead, which is the documented workaround.
        if: ${{ env.HAS_MIRROR_TOKEN == 'true' }}
        env:
          HAS_MIRROR_TOKEN: ${{ secrets.RELEASETWIN_ACTION_MIRROR_TOKEN != '' }}
          MIRROR_TOKEN: ${{ secrets.RELEASETWIN_ACTION_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          major="v${version%%.*}"
          minor="v${version%.*}"
          target="${{ steps.pin.outputs.sha || github.sha }}"
          mirror_repo="ernestoalejowitt22/releasetwin-action"
          mirror_url="https://x-access-token:${MIRROR_TOKEN}@github.com/${mirror_repo}.git"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout "$target"
          git subtree split --prefix=integrations/github-action -b action-mirror
          git checkout -

          git push --force "$mirror_url" action-mirror:main
          git push --force "$mirror_url" "action-mirror:refs/tags/${version}"
          for t in "$major" "$minor"; do
            git push --force "$mirror_url" "action-mirror:refs/tags/${t}"
            echo "mirrored -> ${mirror_repo}@${t}"
          done
          git branch -D action-mirror
