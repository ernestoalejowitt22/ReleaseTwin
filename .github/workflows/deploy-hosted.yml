name: Deploy Hosted API

# Auto-deploys the hosted API + its terraform footprint whenever hosted code or infra lands on
# main. The paths filter keeps frontend-only / docs-only / non-hosted merges from triggering a
# no-op apply. `workflow_dispatch` stays for manual runs and prefix/region overrides.
#
# The deploy role's own permissions are managed by hosted/terraform-bootstrap, which auto-applies
# via bootstrap.yml — so a change here that needs a new AWS permission goes in the same PR as the
# bootstrap statement that grants it, and both apply on merge.
#
# Still OIDC, no stored AWS key. Remote S3 state (main.tf) means each run is an incremental apply.
on:
  push:
    branches: [main]
    paths:
      - "hosted/ReleaseTwin.Hosted.Api/**"
      - "hosted/terraform/**"
      - ".github/workflows/deploy-hosted.yml"
  workflow_dispatch:
    inputs:
      table_prefix:
        description: "DynamoDB table / resource name prefix"
        default: "releasetwin-dev-"
      region:
        description: "AWS region"
        default: "us-east-1"

permissions:
  id-token: write # required to request the OIDC token that's exchanged for AWS credentials
  contents: read

concurrency:
  group: deploy-hosted
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Amazon.Lambda.Tools
        run: dotnet tool install -g Amazon.Lambda.Tools

      # Terraform doesn't compile .NET code (design.md) — build the deployment zip first, terraform
      # references it by path.
      - name: Build Lambda deployment package
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet lambda package -pl hosted/ReleaseTwin.Hosted.Api -o hosted/terraform/lambda-package.zip

      # No stored AWS access key anywhere — the role trusts this repo's OIDC token directly
      # (hosted/terraform-bootstrap). AWS_DEPLOY_ROLE_ARN is a plain repo variable (ARNs aren't
      # secret), set from that bootstrap's `github_actions_role_arn` output.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          # inputs.* is empty on a push trigger — fall back to the same defaults workflow_dispatch uses.
          aws-region: ${{ inputs.region || 'us-east-1' }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"

      - name: Terraform init
        working-directory: hosted/terraform
        run: terraform init

      # onboarding-activation: the guided first-run panel's CLI command needs the hosted API's own
      # public URL. Referencing aws_lambda_function_url in the function's own env block is a terraform
      # cycle, so read it from the already-applied remote state instead and feed it back as a -var.
      # Empty on the very first deploy (the resource doesn't exist yet) — the panel shows a
      # placeholder until the next hosted deploy, which self-heals it. No manual step.
      - name: Resolve API public URL from state
        id: api_url
        working-directory: hosted/terraform
        run: echo "value=$(terraform output -raw function_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"

      # design.md two-pass apply: GitHubConnection__* vars/secrets are empty until the GitHub OAuth
      # App is registered (needs the Vercel URL, which needs this workflow's own first-pass output)
      # — re-running this workflow with those set updates the Lambda's env vars in place.
      # operator-alerting: OPERATOR_ALERT_EMAIL is a plain repo variable (not a secret — it's just
      # an address), same treatment as GH_OAUTH_CLIENT_ID. Left unset, alerting.tf creates the SNS
      # topic with no subscription and the digest Lambda logs a warning instead of publishing — set
      # this repo variable before relying on this change for real (tasks.md group 1).
      - name: Terraform apply
        working-directory: hosted/terraform
        run: |
          if [ -z "${{ vars.CLERK_DOMAIN }}" ]; then
            echo "::error::CLERK_DOMAIN repo variable is not set — it is the JWT issuer the API validates. Set it (e.g. <slug>.clerk.accounts.dev) and re-run."
            exit 1
          fi
          terraform apply -auto-approve \
            -var="table_prefix=${{ inputs.table_prefix || 'releasetwin-dev-' }}" \
            -var="region=${{ inputs.region || 'us-east-1' }}" \
            -var="clerk_domain=${{ vars.CLERK_DOMAIN }}" \
            -var="admin_operator_user_ids=${{ vars.ADMIN_OPERATOR_USER_IDS }}" \
            -var="web_base_url=${{ vars.WEB_BASE_URL }}" \
            -var="api_public_url=${{ steps.api_url.outputs.value }}" \
            -var="github_client_id=${{ vars.GH_OAUTH_CLIENT_ID }}" \
            -var="github_client_secret=${{ secrets.GH_OAUTH_CLIENT_SECRET }}" \
            -var="github_callback_url=${{ vars.GH_OAUTH_CALLBACK_URL }}" \
            -var="operator_alert_email=${{ vars.OPERATOR_ALERT_EMAIL }}" \
            -var="polar_api_token=${{ secrets.POLAR_API_TOKEN }}" \
            -var="polar_webhook_secret=${{ secrets.POLAR_WEBHOOK_SECRET }}" \
            -var="polar_api_base_url=${{ vars.POLAR_API_BASE_URL || 'https://api.polar.sh' }}" \
            -var="polar_product_team_monthly=${{ vars.POLAR_TEAM_PRODUCT_MONTHLY }}" \
            -var="polar_product_team_annual=${{ vars.POLAR_TEAM_PRODUCT_ANNUAL }}" \
            -var="polar_checkout_success_url=${{ vars.POLAR_CHECKOUT_SUCCESS_URL }}" \
            -var="polar_checkout_cancel_url=${{ vars.POLAR_CHECKOUT_CANCEL_URL }}" \
            -var="polar_portal_return_url=${{ vars.POLAR_PORTAL_RETURN_URL }}" \
            -var="polar_reconciliation_dry_run=${{ vars.POLAR_RECONCILIATION_DRY_RUN || 'true' }}" \
            -var="polar_upgrade_enabled=${{ vars.POLAR_UPGRADE_ENABLED || 'false' }}"

      - name: Function URL
        working-directory: hosted/terraform
        run: |
          echo "Function URL: $(terraform output -raw function_url)" >> "$GITHUB_STEP_SUMMARY"
          echo "Operator alerts SNS topic: $(terraform output -raw operator_alerts_topic_arn)" >> "$GITHUB_STEP_SUMMARY"
