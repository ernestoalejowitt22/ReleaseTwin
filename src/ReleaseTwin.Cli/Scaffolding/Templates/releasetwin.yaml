# ReleaseTwin project config (optional).
#
# With no `adapters:` list, the CLI auto-loads every adapter whose credentials
# are present — the default. Add a list to make it explicit: only the listed
# adapters are considered, and a listed adapter with no credentials is a
# startup error rather than a silent skip. `http` is always available.
#
# Credentials never go in this file — they come from environment variables or,
# on the hosted platform, your project's stored adapter credentials.

# adapters:
#   - http            # credential-free, always available
#   - azure-devops    # AZDO_ORG / AZDO_PROJECT / AZDO_PAT / AZDO_AREA_PATH / AZDO_VARIABLE_GROUP_ID
#   - launchdarkly    # LAUNCHDARKLY_API_TOKEN / LAUNCHDARKLY_PROJECT_KEY / LAUNCHDARKLY_ENVIRONMENT_KEY
#   - ui              # Playwright Chromium; also enabled by RELEASETWIN_UI_ENABLED=1
